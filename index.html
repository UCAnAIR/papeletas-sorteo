<script>
  // Si la página se abre como «/papeletas» (sin barra final), los archivos
  // se buscan igualmente dentro de la carpeta «/papeletas/».
  (function () {
    var p = location.pathname;
    if (!p.endsWith("/") && !/\.[a-z0-9]+$/i.test(p)) {
      var b = document.createElement("base"); b.href = p + "/"; document.head.appendChild(b);
    }
  })();
</script>

<meta name="description" content="Genera el PDF con las papeletas numeradas del sorteo de UCA&Air.">
<script>
  // Tema: claro por defecto; el botón de la esquina cambia a oscuro y se recuerda.
  (function () {
    var t = "light";
    try { t = localStorage.getItem("tema") || "light"; } catch (_) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Vibes"; src: url("fuente.ttf") format("truetype"); font-display: swap; }
  :root {
    --bg: #ffffff; --ink: #16201b; --muted: #6b746f; --line: #e3e7e4; --field: #f5f7f5;
    --pine: #1f5c43; --berry: #c0392b; --btn: #16201b; --btn-ink: #ffffff; --err: #b3261e;
    --desk: #eef1ef;
    --sheet-shadow: 0 1px 1px rgba(22,32,27,.10), 0 4px 8px -2px rgba(22,32,27,.10), 0 24px 48px -16px rgba(22,32,27,.28);
  }
  :root[data-theme="dark"] {
    --bg: #0f1714; --ink: #eaeeeb; --muted: #97a29c; --line: #26322c; --field: #16211c;
    --pine: #8cc3a4; --berry: #e26a5c; --btn: #eaeeeb; --btn-ink: #0f1714; --err: #ff8a80;
    --desk: #18221d;
    --sheet-shadow: 0 1px 1px rgba(0,0,0,.4), 0 6px 12px -4px rgba(0,0,0,.45), 0 28px 56px -16px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
  body {
    margin: 0; position: relative; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background-color .2s, color .2s;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 80px 16px 56px; }

  /* Guirnalda de luces */
  .luces { position: absolute; top: 0; left: 0; right: 0; height: 64px; pointer-events: none; overflow: hidden; z-index: 2; }
  .luces svg { display: block; width: 100%; height: 100%; }
  .luces .cable { fill: none; stroke: var(--ink); stroke-opacity: .28; stroke-width: 1.3; }
  .luces .casquillo { fill: var(--ink); opacity: .45; }
  .luces .halo { opacity: var(--halo-min); animation: halo 3.6s ease-in-out infinite; }
  .luces .cristal { animation: cristal 3.6s ease-in-out infinite; }
  .luces .reflejo { fill: #fff; opacity: .75; }
  :root { --halo-min: .12; --halo-max: .45; --cristal-min: .78; }
  :root[data-theme="dark"] { --halo-min: .35; --halo-max: .95; --cristal-min: .6; }
  @keyframes halo { 0%, 100% { opacity: var(--halo-max); } 50% { opacity: var(--halo-min); } }
  @keyframes cristal { 0%, 100% { opacity: 1; } 50% { opacity: var(--cristal-min); } }

  /* Nieve */
  #nieve { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main { position: relative; z-index: 1; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 40px; }
  .titulo { display: flex; align-items: center; gap: 14px; }
  .titulo svg { flex: none; width: clamp(36px, 6vw, 48px); height: auto; }
  h1 { margin: 0; font-family: "Vibes", cursive; font-weight: 400; font-size: clamp(40px, 7vw, 60px); line-height: 1; letter-spacing: 0; }
  .sub { margin: 6px 0 0 2px; color: var(--muted); font-size: 15px; }
  .marca { display: flex; align-items: center; gap: 20px; flex: none; }
  .logo { height: 54px; width: auto; display: block; }
  .logo title { display: none; }
  @media (max-width: 800px) { .logo { height: 40px; } .marca { gap: 12px; flex-direction: column-reverse; align-items: flex-end; } }
  .tema {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center;
  }
  .tema:hover { background: var(--field); }
  .tema svg { width: 18px; height: 18px; }
  .tema .sol { display: none; } :root[data-theme="dark"] .tema .sol { display: block; } :root[data-theme="dark"] .tema .luna { display: none; }

  .layout { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 520px); justify-content: space-between; gap: 48px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; gap: 32px; } header { margin-bottom: 28px; } }

  form { display: grid; gap: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  input {
    font: inherit; font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; width: 100%;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink);
    -moz-appearance: textfield; appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input::placeholder { color: var(--muted); opacity: .45; }
  :focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
  input:focus-visible { border-color: transparent; }
  input[aria-invalid="true"] { border-color: var(--err); }
  input[aria-invalid="true"]:focus-visible { outline-color: var(--err); }
  .aviso { color: var(--err); font-size: 13px; line-height: 1.35; min-height: 0; }
  .aviso:empty { display: none; }
  #status.nota { color: var(--muted); }

  .btn {
    font: inherit; font-weight: 600; font-size: 15px; border-radius: 8px; padding: 12px 16px;
    cursor: pointer; text-align: center; text-decoration: none; display: block; border: 1px solid transparent;
  }
  .btn.primary { background: var(--btn); color: var(--btn-ink); }
  .btn.primary:hover { opacity: .88; }
  .btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.secondary:hover { background: var(--field); }
  .btn:disabled { opacity: .5; cursor: progress; }

  #status { min-height: 1.5em; font-size: 14px; color: var(--muted); margin: -4px 0 0; }
  #status.ok { color: var(--pine); } #status.err { color: var(--err); }
  #actions { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
  #actions.show { display: grid; }

  .extra { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); display: grid; gap: 8px; }
  .extra p { margin: 0; }
  .extra a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .extra a:hover { text-decoration-color: currentColor; }

  .preview { background: var(--desk); border-radius: 14px; padding: 22px; }
  .preview canvas { display: none; width: 100%; height: auto; background: #fff; padding: 8px; border-radius: 2px; box-shadow: var(--sheet-shadow); }
  .preview .empty { aspect-ratio: 210 / 297; border: 1px dashed var(--muted); border-radius: 2px; opacity: .6;
    display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; padding: 24px; }
  .preview.has canvas { display: block; } .preview.has .empty { display: none; }
  @media (max-width: 800px) { .preview { padding: 14px; } .preview canvas { padding: 5px; } .preview:not(.has) { display: none; } }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } .luces .halo, .luces .cristal { animation: none; } #nieve { display: none; } }
</style>

<script>
(() => {
  const C = window.CONFIG;
  pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";

  const $ = (id) => document.getElementById(id);
  const form = $("form"), desdeEl = $("desde"), hastaEl = $("hasta"), btn = $("generar");
  const statusEl = $("status"), actions = $("actions"), dl = $("descargar"), abrir = $("abrir");
  const preview = $("preview"), visor = $("visor");
  let plantilla = null;   // se carga una vez
  let lastUrl = null;

  const fmt = (n) => String(n).padStart(C.cifras, "0");
  function setStatus(msg, kind = "") { statusEl.textContent = msg; statusEl.className = kind; }

  async function fetchBytes(path) {
    const r = await fetch(path, { cache: "no-cache" });
    if (!r.ok) throw new Error(`No se pudo cargar «${path}» (${r.status}).`);
    return new Uint8Array(await r.arrayBuffer());
  }

  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    const v = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16) / 255);
  }

  function rectFor(m) {
    const t = C.tapar, s = m.size;
    return { x: m.x - t.izquierda * s, y: m.y - t.abajo * s,
             w: m.w + (t.izquierda + t.derecha) * s, h: (t.abajo + t.arriba) * s };
  }

  // Ordena los huecos en filas (o columnas) aunque no estén perfectamente alineados
  function ordenar(marks) {
    const porFilas = C.orden !== "columnas";
    const main = (m) => (porFilas ? -m.y : m.x);
    const cross = (m) => (porFilas ? m.x : -m.y);
    const sorted = [...marks].sort((a, b) => main(a) - main(b));
    const groups = [];
    for (const m of sorted) {
      const g = groups[groups.length - 1];
      if (g && Math.abs(main(m) - main(g[0])) < m.size * 0.6) g.push(m); else groups.push([m]);
    }
    return groups.flatMap((g) => g.sort((a, b) => cross(a) - cross(b)));
  }

  // Cada papeleta ocupa una celda de una cuadrícula regular (filas × columnas) que cubre la hoja.
  // Se usa para no imprimir las papeletas que sobran en la última hoja.
  function asignarCeldas(marks, W, H) {
    const grupos = (vals, tol) => {
      const g = [];
      for (const v of [...vals].sort((a, b) => a - b)) if (!g.length || v - g[g.length - 1] > tol) g.push(v);
      return g.length;
    };
    const cx = marks.map((m) => m.x + m.w / 2), cy = marks.map((m) => m.y + m.size * 0.35);
    const tol = Math.max(...marks.map((m) => m.size), 1) * 0.6;
    const cols = grupos(cx, tol), filas = grupos(cy, tol);
    const cw = W / cols, ch = H / filas;
    marks.forEach((m, i) => {
      const c = Math.min(cols - 1, Math.max(0, Math.floor(cx[i] / cw)));
      const f = Math.min(filas - 1, Math.max(0, Math.floor((H - cy[i]) / ch)));
      m.celda = { x: c * cw, y: H - (f + 1) * ch, w: cw, h: ch };
    });
  }

  // Lee la plantilla: localiza cada marcador y el color de fondo que hay detrás
  async function cargarPlantilla() {
    if (plantilla) return plantilla;
    const [pdfBytes, fontBytes] = await Promise.all([fetchBytes(C.plantilla), fetchBytes(C.fuente)]);
    const doc = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const [vx, vy, vx2, vy2] = page.view;
      const tc = await page.getTextContent();
      let marks = [];
      for (const it of tc.items) {
        let idx = it.str.indexOf(C.marcador);
        while (idx >= 0) {
          const [, , c, d, e, f] = it.transform;
          const n = it.str.length, size = Math.hypot(c, d) || it.height;
          marks.push({ x: e + (it.width * idx) / n - vx, y: f - vy,
                       w: (it.width * C.marcador.length) / n, size });
          idx = it.str.indexOf(C.marcador, idx + C.marcador.length);
        }
      }
      marks = ordenar(marks);
      asignarCeldas(marks, vx2 - vx, vy2 - vy);

      // Muestra el color del borde del recuadro para taparlo con el mismo color
      const scale = 1.5, vp = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const pageH = vy2 - vy;
      for (const m of marks) {
        const r = rectFor(m), votes = new Map();
        const pts = [];
        for (let k = 0; k <= 10; k++) {
          const px = r.x + (r.w * k) / 10, py = r.y + (r.h * k) / 10;
          pts.push([px, r.y - 1], [px, r.y + r.h + 1], [r.x - 1, py], [r.x + r.w + 1, py]);
        }
        for (const [px, py] of pts) {
          const cx = Math.round(px * scale), cy = Math.round((pageH - py) * scale);
          if (cx < 0 || cy < 0 || cx >= canvas.width || cy >= canvas.height) continue;
          const [R, G, B] = ctx.getImageData(cx, cy, 1, 1).data;
          const key = [R, G, B].map((v) => Math.round(v / 8) * 8).join(",");
          votes.set(key, (votes.get(key) || 0) + 1);
        }
        const best = [...votes.entries()].sort((a, b) => b[1] - a[1])[0];
        m.bg = best ? best[0].split(",").map((v) => Math.min(255, +v) / 255) : [1, 1, 1];
      }
      pages.push({ marks, width: vx2 - vx, height: pageH, ox: vx, oy: vy });
    }
    const total = pages.reduce((s, p) => s + p.marks.length, 0);
    if (!total) throw new Error(`La plantilla no tiene ningún «${C.marcador}» donde poner el número.`);
    plantilla = { pdfBytes, fontBytes, pages, porCiclo: total };
    return plantilla;
  }

  // blanco = true → una hoja con una línea para escribir el número a mano
  async function generar(desde, hasta, blanco = false) {
    const P = await cargarPlantilla();
    const { PDFDocument, rgb, pushGraphicsState, popGraphicsState, rectangle, clip, endPath } = PDFLib;
    const out = await PDFDocument.create();
    out.registerFontkit(fontkit);
    const font = await out.embedFont(P.fontBytes, { subset: true });
    const tpl = await PDFDocument.load(P.pdfBytes);
    const embedded = await out.embedPages(tpl.getPages());
    const color = rgb(...hexToRgb(C.color));

    let n = desde, hojas = 0;
    while (blanco ? hojas === 0 : n <= hasta) {
      for (let p = 0; p < P.pages.length && (blanco || n <= hasta); p++) {
        const info = P.pages[p];
        const page = out.addPage([info.width, info.height]);
        // Si en esta hoja sobran huecos, solo se dibujan las celdas de las papeletas que llevan número
        const quedan = hasta - n + 1;
        const usadas = blanco || quedan >= info.marks.length ? info.marks : info.marks.slice(0, Math.max(0, quedan));
        const recortar = usadas.length < info.marks.length;
        if (recortar) {
          const ops = [pushGraphicsState()];
          for (const m of usadas) ops.push(rectangle(m.celda.x, m.celda.y, m.celda.w, m.celda.h));
          ops.push(clip(), endPath());
          page.pushOperators(...ops);
        }
        // Algunos PDF de Canva no empiezan en (0,0): se compensa para que todo cuadre
        page.drawPage(embedded[p], { x: -info.ox, y: -info.oy });
        if (recortar) page.pushOperators(popGraphicsState());
        hojas++;
        for (const m of usadas) {
          const r = rectFor(m);
          page.drawRectangle({ x: r.x, y: r.y, width: r.w, height: r.h, color: rgb(...m.bg) });
          if (blanco) {
            const ancho = m.w + 0.3 * m.size, x = m.x + m.w / 2 - ancho / 2, y = m.y + 0.02 * m.size;
            page.drawLine({ start: { x, y }, end: { x: x + ancho, y }, thickness: 0.9, color });
            continue;
          }
          const txt = fmt(n++);
          const tw = font.widthOfTextAtSize(txt, m.size);
          page.drawText(txt, { x: m.x + m.w / 2 - tw / 2, y: m.y, size: m.size, font, color });
        }
      }
    }
    out.setTitle(blanco ? "Papeletas en blanco · Sorteo UCA&Air" : `Papeletas ${fmt(desde)}–${fmt(hasta)} · Sorteo UCA&Air`);
    out.setCreator("UCA&Air · Generador de papeletas");
    const bytes = await out.save();
    return { bytes, hojas, porHoja: P.porCiclo / P.pages.length };
  }

  async function pintarVista(bytes) {
    try {
      const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
      const page = await doc.getPage(1);
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(2.5, (visor.parentElement.clientWidth * (window.devicePixelRatio || 1)) / base.width) || 1.5;
      const vp = page.getViewport({ scale });
      visor.width = Math.ceil(vp.width); visor.height = Math.ceil(vp.height);
      await page.render({ canvasContext: visor.getContext("2d"), viewport: vp }).promise;
      preview.classList.add("has");
      doc.destroy();
    } catch (e) { console.warn("Sin vista previa:", e); }
  }

  $("blanco").addEventListener("click", async (ev) => {
    ev.preventDefault();
    setStatus("Generando papeletas en blanco…");
    try {
      const { bytes } = await generar(1, 1, true);
      const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      const a = document.createElement("a");
      a.href = url; a.download = "papeletas_en_blanco.pdf";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      setStatus("Papeletas en blanco descargadas.", "ok");
    } catch (e) {
      console.error(e);
      setStatus(e.message || "No se pudo generar el PDF.", "err");
    }
  });

  // ── Lectura de números a prueba de despistes ──────────────────
  // Acepta espacios, «Nº 101», «#101», «0101», «1.000», números copiados de una hoja
  // con caracteres invisibles e incluso «101-200» escrito en una sola casilla.
  const MAXIMO_NUM = 10 ** C.cifras - 1;
  function limpiar(v) {
    return String(v ?? "")
      .normalize("NFKC")                               // dígitos de ancho completo, espacios raros…
      .replace(/[​-‍⁠﻿­]/g, "") // caracteres invisibles
      .replace(/\s+/g, " ").trim()
      .replace(/^(?:n\.?\s*[º°o]\.?|n[uú]m(?:ero)?\.?|#)\s*/i, "");
  }
  function leerRango(v) {
    const m = limpiar(v).match(/^(\d[\d.,\s]*?)\s*(?:-|–|—|\/|\ba\b|\bal\b|\bhasta\b)\s*(\d[\d.,\s]*)$/i);
    if (m) return [m[1], m[2]];
    // «101 200»: dos números separados por un espacio (salvo «1 000», que es mil)
    const e = limpiar(v).match(/^(\d+)\s+(\d+)$/);
    if (e && !(e[1].length === 1 && e[2].length === 3)) return [e[1], e[2]];
    return null;
  }
  function leerNumero(v) {
    const t = limpiar(v);
    if (t === "") return { vacio: true };
    let n = t.replace(/\s+/g, "");
    if (/^\d{1,3}([.,]\d{3})+$/.test(n)) n = n.replace(/[.,]/g, "");   // 1.000 o 1,000
    if (/^\d+$/.test(n)) {
      const num = parseInt(n, 10);
      if (num > MAXIMO_NUM) return { error: `El número más alto posible es ${MAXIMO_NUM}.` };
      return { n: num };
    }
    if (/^-\s*\d/.test(n)) return { error: "No puede ser negativo." };
    if (/^\d+[.,]\d+$/.test(n)) return { error: "Escribe un número entero, sin decimales." };
    const sobra = [...new Set(n.replace(/[\d]/g, ""))].map((c) => `«${c}»`).join(" ");
    return { error: `Escribe solo cifras. Sobra ${sobra}.` };
  }
  function marcar(el, msg) {
    const aviso = $("aviso-" + el.id);
    aviso.textContent = msg || "";
    el.setAttribute("aria-invalid", msg ? "true" : "false");
  }
  function hojasPara(cantidad) {
    const porHoja = plantilla ? plantilla.porCiclo / plantilla.pages.length : 10;
    return Math.ceil(cantidad / porHoja);
  }
  // Si alguien escribe «101-200» en una casilla, lo repartimos en las dos
  function repartirRango(el) {
    const r = leerRango(el.value);
    if (!r) return false;
    desdeEl.value = r[0].trim(); hastaEl.value = r[1].trim();
    return true;
  }
  // Comprueba las dos casillas y devuelve el intervalo, o null si hay algo que corregir
  function validar({ final = false } = {}) {
    const a = leerNumero(desdeEl.value), b = leerNumero(hastaEl.value);
    marcar(desdeEl, a.error); marcar(hastaEl, b.error);
    if (a.error || b.error) return null;
    if (a.vacio && b.vacio) { if (final) { marcar(desdeEl, "Escribe el primer número."); desdeEl.focus(); } return null; }
    let desde = a.vacio ? b.n : a.n, hasta = b.vacio ? a.n : b.n, notas = [];
    if (final && (a.vacio || b.vacio)) notas.push("Solo había un número, así que se genera una papeleta.");
    if (hasta < desde) {
      [desde, hasta] = [hasta, desde];
      if (final) notas.push("Los números estaban al revés y se han ordenado.");
    }
    const cantidad = hasta - desde + 1;
    if (cantidad > C.maximo) {
      marcar(hastaEl, `Son ${cantidad} papeletas y el máximo es ${C.maximo}. Divídelo en varios bloques.`);
      return null;
    }
    return { desde, hasta, cantidad, notas };
  }
  // Mientras se escribe: avisos al momento y resumen de lo que se va a generar
  for (const el of [desdeEl, hastaEl]) {
    el.addEventListener("input", () => {
      if (actions.classList.contains("show")) {           // el PDF anterior ya no corresponde
        actions.classList.remove("show"); preview.classList.remove("has");
      }
      if (leerRango(el.value)) { setStatus("Se repartirá en Desde y Hasta al salir de la casilla.", "nota"); marcar(el, ""); return; }
      const v = validar();
      if (v) setStatus(`${v.cantidad} papeleta${v.cantidad === 1 ? "" : "s"} en ${hojasPara(v.cantidad)} hoja${hojasPara(v.cantidad) === 1 ? "" : "s"}.`, "nota");
      else setStatus("");
    });
    el.addEventListener("blur", () => {
      repartirRango(el);
      // Deja el número limpio a la vista (sin espacios ni «Nº»)
      for (const e of [desdeEl, hastaEl]) { const r = leerNumero(e.value); if (r.n !== undefined) e.value = String(r.n); }
      validar();
    });
  }

  let generando = false;
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (generando) return;
    repartirRango(desdeEl) || repartirRango(hastaEl);
    const v = validar({ final: true });
    if (!v) { setStatus("Revisa los números marcados en rojo.", "err"); return; }
    const { desde, hasta, cantidad, notas } = v;
    desdeEl.value = String(desde); hastaEl.value = String(hasta);
    marcar(desdeEl, ""); marcar(hastaEl, "");

    generando = true; btn.disabled = true; actions.classList.remove("show");
    setStatus("Generando…", "nota");
    try {
      const { bytes, hojas } = await generar(desde, hasta);
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      dl.href = lastUrl; dl.download = `papeletas_${fmt(desde)}-${fmt(hasta)}.pdf`;
      abrir.href = lastUrl;
      await pintarVista(bytes);
      actions.classList.add("show");
      const resumen = `${cantidad} papeleta${cantidad === 1 ? "" : "s"}, del ${fmt(desde)} al ${fmt(hasta)}, en ${hojas} hoja${hojas === 1 ? "" : "s"}.`;
      setStatus([resumen, ...notas].join(" "), "ok");
      try { history.replaceState(null, "", `?desde=${desde}&hasta=${hasta}`); } catch (_) {}
    } catch (e) {
      console.error(e);
      setStatus(e.message || "No se pudo generar el PDF. Recarga la página y vuelve a intentarlo.", "err");
    } finally {
      generando = false; btn.disabled = false;
    }
  });

  const temaBtn = $("tema");
  function pintarTema() {
    const oscuro = document.documentElement.getAttribute("data-theme") === "dark";
    temaBtn.setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
  }
  temaBtn.addEventListener("click", () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("tema", t); } catch (_) {}
    pintarTema();
  });
  pintarTema();

  // Guirnalda: un cable con curvas entre ganchos y bombillas de cristal con halo
  const COLORES = { r: "#e5483d", v: "#2fa36b", o: "#f2b632", b: "#6fb3ef" };
  function pintarLuces() {
    const svg = $("luces"), w = Math.max(320, document.documentElement.clientWidth);
    const tramo = w < 600 ? 96 : 128, y0 = 4, caida = 18, orden = ["r", "o", "v", "b"];
    const n = Math.ceil(w / tramo) + 1;
    let defs = "";
    for (const [k, c] of Object.entries(COLORES)) {
      defs += `<radialGradient id="h-${k}"><stop offset="0" stop-color="${c}" stop-opacity=".9"/><stop offset=".35" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>` +
              `<radialGradient id="c-${k}" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".85"/></radialGradient>`;
    }
    let d = `M0 ${y0}`, bombillas = "", k = 0;
    for (let i = 0; i < n; i++) {
      const x = i * tramo;
      d += ` Q${x + tramo / 2} ${y0 + 2 * caida} ${x + tramo} ${y0}`;
      for (const t of [0.25, 0.5, 0.75]) {
        const bx = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * (x + tramo / 2) + t * t * (x + tramo);
        const by = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * (y0 + 2 * caida) + t * t * y0;
        const slope = 2 * (1 - t) * (2 * caida) * -1 + 2 * t * (2 * caida);   // pendiente del cable
        const ang = (Math.atan2(-slope, tramo) * 180 / Math.PI * 0.6).toFixed(1);
        const c = orden[k % orden.length], delay = ((k * 1.37) % 3.6).toFixed(2);
        bombillas += `<g transform="translate(${bx.toFixed(1)} ${by.toFixed(1)}) rotate(${ang})">` +
          `<circle class="halo" cx="0" cy="10" r="15" fill="url(#h-${c})" style="animation-delay:-${delay}s"/>` +
          `<rect class="casquillo" x="-2.4" y="-1" width="4.8" height="4.5" rx="1"/>` +
          `<path class="cristal" d="M0 3.2c3.4 0 4.6 4 4.2 7.2C3.8 13.6 2 15.6 0 15.6s-3.8-2-4.2-5.2C-4.6 7.2-3.4 3.2 0 3.2z" fill="url(#c-${c})" style="animation-delay:-${delay}s"/>` +
          `<ellipse class="reflejo" cx="-1.4" cy="7.4" rx=".9" ry="1.8"/></g>`;
        k++;
      }
    }
    svg.setAttribute("viewBox", `0 0 ${w} 64`);
    svg.innerHTML = `<defs>${defs}</defs><path class="cable" d="${d}"/>${bombillas}`;
  }

  // Nieve muy ligera de fondo (se desactiva con «reducir movimiento»)
  function nevar() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("nieve"), ctx = cv.getContext("2d");
    let W, H, copos = [];
    function medir() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const total = Math.round(Math.min(46, W / 28));
      copos = Array.from({ length: total }, () => ({
        x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.2,
        v: 0.25 + Math.random() * 0.55, f: Math.random() * Math.PI * 2, a: 0.35 + Math.random() * 0.5,
      }));
    }
    medir(); window.addEventListener("resize", medir);
    (function paso() {
      const oscuro = document.documentElement.getAttribute("data-theme") === "dark";
      ctx.clearRect(0, 0, W, H);
      for (const c of copos) {
        c.y += c.v; c.f += 0.01; c.x += Math.sin(c.f) * 0.3;
        if (c.y > H + 4) { c.y = -4; c.x = Math.random() * W; }
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = oscuro ? `rgba(255,255,255,${c.a * 0.55})` : `rgba(120,150,170,${c.a * 0.28})`;
        ctx.fill();
      }
      requestAnimationFrame(paso);
    })();
  }
  nevar();
  pintarLuces();
  let lucesTimer;
  window.addEventListener("resize", () => { clearTimeout(lucesTimer); lucesTimer = setTimeout(pintarLuces, 150); });

  // Enlaces directos desde la hoja de cálculo: ?desde=101&hasta=200
  const q = new URLSearchParams(location.search);
  if (q.get("desde")) desdeEl.value = q.get("desde");
  if (q.get("hasta")) hastaEl.value = q.get("hasta");
  if (q.get("desde") || q.get("hasta")) form.requestSubmit();
})();
</script>
</body>
</html>
